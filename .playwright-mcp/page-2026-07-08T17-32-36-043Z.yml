        - heading "Multi-agent work fails in the gaps. Nexus closes them." [level=2] [ref=e53]:
          - text: Multi-agent work fails in the gaps.
          - emphasis [ref=e54]: Nexus closes them.
        - generic [ref=e55]:
          - paragraph [ref=e56]: The hard part is no longer getting one agent to produce code. The hard part is letting multiple harnesses work at the same time without hidden state, duplicated effort, unsafe messages, or operator decisions buried in terminal scrollback.
          - paragraph [ref=e57]: "Nexus turns coordination into infrastructure: explicit routing, governed writes, queueable approvals, workspace health, and a dashboard that shows what the agent team is actually doing."
