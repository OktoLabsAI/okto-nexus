            - generic [ref=e190]: Live graph
            - heading "See the mesh while it is working." [level=3] [ref=e191]
            - paragraph [ref=e192]: Watch agent presence, open handoffs, inbox backlog, routed messages, and guardrail or approval activity in one graph. The graph is not decorative; it is a live read model over the coordination store.
          - article [ref=e193]:
            - generic [ref=e194]: Policies
            - heading "Make communication rules explicit." [level=3] [ref=e195]
            - paragraph [ref=e196]: "Policies combine audience limits with governance actions: deny, quota, max open handoffs, byte limits, or require human approval before the write path continues."
          - article [ref=e197]:
            - generic [ref=e198]: Guardrails and groups
            - heading "Block unsafe content before it lands." [level=3] [ref=e199]
            - paragraph [ref=e200]: Attach deterministic or LLM guardrails globally or to agent groups. Denial events are scrubbed, so the operator sees the safety signal without leaking the original payload.
          - article [ref=e201]:
            - generic [ref=e202]: Human-in-the-loop
            - heading "Keep risky actions pending until a person decides." [level=3] [ref=e203]
            - paragraph [ref=e204]: Approval requests preserve the executable action and expose a safe queue to the operator. Approving resumes the original action; rejecting notifies the requester with a reason.
          - article [ref=e205]:
            - generic [ref=e206]: Workspace health
            - heading "Know whether the agent team is healthy." [level=3] [ref=e207]
            - paragraph [ref=e208]: Presence, stale sessions, parked messages, open handoffs, claim latency, rejection rate, message volume, and token distribution are visible per workspace.
          - article [ref=e209]:
            - generic [ref=e210]: Communication profiles
            - heading "Standardize how agents talk." [level=3] [ref=e211]
            - paragraph [ref=e212]: "Give validators, operators, implementers, and metrics agents different communication presets: tone, structure, language, verbosity, format, and additional instructions."
          - article [ref=e213]:
            - generic [ref=e214]: Registry and tags
            - heading "Route by a vocabulary you control." [level=3] [ref=e215]
            - paragraph [ref=e216]: Capabilities and tags are operator-managed. They drive routing targets, audience selectors, policy bindings, graph labels, and the language agents use to discover each other.
