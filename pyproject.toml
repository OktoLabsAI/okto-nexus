[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-nexus"
version = "0.0.1"
description = "Okto Nexus - Local Agent Coordination Bus (MCP server + dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic License 2.0 + SaaS/Branding Addendum + Trademark Policy" }
authors = [{ name = "Okto Labs" }]
dependencies = [
    "mcp>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
# HTTP transport + dashboard surfaces (`okto-nexus serve`). The stdio server
# stays dependency-light; `serve` fails closed with an install hint when the
# extra is missing.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
okto-nexus = "okto_nexus.adapters.inbound.mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the SQL migrations and the built dashboard inside the wheel.
[tool.setuptools.package-data]
okto_nexus = [
    "migrations/*.sql",
    "adapters/inbound/http/static/**/*",
    "adapters/inbound/http/LICENSE.txt",
    "adapters/inbound/cli/banner.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
