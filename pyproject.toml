[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-nexus"
version = "0.1.0"
description = "Okto Nexus - Local Agent Coordination Bus (MCP stdio server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Okto Labs" }]
dependencies = [
    "mcp>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
okto-nexus = "okto_nexus.adapters.inbound.mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the SQL migrations inside the wheel (they live in okto_nexus/migrations/).
[tool.setuptools.package-data]
okto_nexus = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
