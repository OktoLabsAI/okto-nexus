[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-nexus"
version = "0.1.1"
description = "Okto Nexus - Local Agent Coordination Bus (MCP server + dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic License 2.0 + SaaS/Branding Addendum + Trademark Policy" }
authors = [{ name = "Okto Labs" }]
dependencies = [
    "mcp>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
# DEFAULT serve build (`okto-nexus serve`): HTTP transport + dashboard + the
# semantic-search model, so `uv tool install ".[serve]"` ships embeddings by
# design. The capability is INSTALLED but still gated by embedding_mode (off by
# default) - shipping the model does NOT auto-enable search. The stdio server
# stays dependency-light; `serve` fails closed with an install hint when the
# transport extra is missing. For a lighter build without torch, use the
# `serve-lite` extra below.
#
# fastapi pin excludes 0.137.0 ONLY: that release's include_router refactor
# runs `Prefix and path cannot be both empty` against empty-path routes and
# crashes app construction at import; 0.110-0.136 and 0.137.1+ are fine
# (empirical bisect via Okto Pulse). Nexus has no empty-path routes today, so
# this is defense-in-depth against a future landmine.
serve = [
    "fastapi>=0.110,!=0.137.0",
    "uvicorn>=0.29",
    "sentence-transformers>=2.5",
    # Token counting for the workspace-analytics view (message "size" = TOKENS,
    # not bytes). o200k_base (GPT-4o family) is available since 0.7.0; loaded
    # fully offline from a vendored BPE blob. Lives ONLY here (serve), never in
    # the stdio core - the tokenizer adapter imports it lazily.
    "tiktoken>=0.7,<1",
]
# Slim serve build WITHOUT the embedding model (no torch): HTTP transport +
# dashboard only. Semantic search still works in `stub` mode (deterministic);
# `local` mode degrades - search answers EMBEDDINGS_UNAVAILABLE since the model
# is absent; `off` keeps it disabled. Use on hosts that won't run real semantic
# search. Install with `uv tool install ".[serve-lite]"`.
serve-lite = [
    "fastapi>=0.110,!=0.137.0",
    "uvicorn>=0.29",
]
# The semantic-search model on its own (Frente 3). `serve` already bundles it;
# this extra stays for composing onto the slim build (`.[serve-lite,embeddings]`)
# or a bare stdio host. Cosine is pure-Python (no numpy), so only the model
# lives behind this extra. Heavy: pulls sentence-transformers + torch.
embeddings = [
    "sentence-transformers>=2.5",
]
dev = [
    "pytest>=8",
    "fastapi>=0.110,!=0.137.0",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
okto-nexus = "okto_nexus.adapters.inbound.mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the SQL migrations and the built dashboard inside the wheel.
[tool.setuptools.package-data]
okto_nexus = [
    "migrations/*.sql",
    "adapters/inbound/http/static/**/*",
    "adapters/inbound/http/LICENSE.txt",
    "adapters/inbound/cli/banner.txt",
    # Vendored o200k_base BPE blob so token counting loads 100% offline (named
    # by tiktoken's SHA1(url) cache key). Source: official tiktoken public blob
    # (MIT-licensed). Ships only with the serve build that uses tiktoken.
    "adapters/outbound/tokenizer/_encodings/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "replay: replay-harness eval tests that reconstruct + re-export an NDJSON event log (I8)",
]
