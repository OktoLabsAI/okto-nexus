<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-label="Okto Nexus">
  <!-- Dark-background wordmark. Metrics mirror the Pulse FRONTEND asset
       (pulse_community/frontend/src/assets/pulse-wordmark.svg): icon accent
       ~34u wide, product text at font-size 26 / y 30. -->
  <defs>
    <linearGradient id="nwi" gradientUnits="userSpaceOnUse" x1="5" y1="34" x2="33" y2="6">
      <stop offset="0%" stop-color="#2438f0"/>
      <stop offset="55%" stop-color="#5b32f4"/>
      <stop offset="100%" stop-color="#9b2cf0"/>
    </linearGradient>
    <linearGradient id="nwt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d35f5"/>
      <stop offset="100%" stop-color="#9b2cf0"/>
    </linearGradient>
  </defs>
  <g transform="translate(3,4)" fill="none" stroke="url(#nwi)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14.5" cy="14.5" r="5.8"/>
    <circle cx="23.5" cy="7.5" r="2.8"/>
    <circle cx="24" cy="23.5" r="2.8"/>
    <circle cx="7" cy="23" r="2.8"/>
    <line x1="19.3" y1="10.8" x2="21.1" y2="9.4"/>
    <line x1="18.9" y1="18.7" x2="21.7" y2="21.4"/>
  </g>
  <!-- Okto (ink) -->
  <text
    x="44"
    y="30"
    font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif"
    font-weight="600"
    font-size="26"
    letter-spacing="-0.5"
    fill="#f4f5f9"
  >Okto</text>
  <!-- Nexus (gradient) -->
  <text
    x="110"
    y="30"
    font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif"
    font-weight="600"
    font-size="26"
    letter-spacing="-0.5"
    fill="url(#nwt)"
  >Nexus</text>
</svg>
